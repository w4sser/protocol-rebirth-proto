<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0C232C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protocol Rebirth">
<meta name="application-name" content="Protocol Rebirth">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="nodspel/icons/happy-node.svg?v=1.60.0" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="nodspel/icons/happy-node-large-180.png?v=1.60.0">
<link rel="preload" as="image" href="assets/production/splash.webp">
<title>Protocol Rebirth</title>
<style>
:root{--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
@media (pointer:coarse){:root{--sl:max(env(safe-area-inset-left,0px),12px);--sr:max(env(safe-area-inset-right,0px),12px)}}

  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    /* Protocol Rebirth design system — "Swedish summer nights" (assets/colors_and_type.css) */
    --bg:#07151C; --panel:#0C232C; --panel2:#123039; --line:#1C424C;
    --txt:#F2E9D6; --dim:#7E9088; --accent:#3FE0D0; --accent2:#FF9D4D;
    --danger:#E4705F; --track:#9A6DF0;
    --glow-teal:0 0 1px #3FE0D0, 0 0 14px rgba(60,242,220,.5);
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; background:#000; overflow:hidden;}
  body{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;}
  #phone{width:100vw; height:100vh; height:100dvh; background:var(--bg); color:var(--txt);
    display:flex; flex-direction:column; position:relative; overflow:hidden;}
  #topbar{display:flex; align-items:center; gap:10px; padding:6px 12px; background:var(--panel);
    border-bottom:1px solid var(--line); flex-shrink:0;}
  #topbar .reset-progress{margin-left:auto; flex:none; width:auto; padding:3px 9px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; background:transparent; color:var(--dim); border:1px solid rgba(255,255,255,.18); border-radius:6px; cursor:pointer;}
  #topbar .reset-progress:hover,#topbar .reset-progress:focus-visible{color:var(--danger); border-color:var(--danger);}
  #topbar .title{font-size:11px; letter-spacing:.14em; color:var(--dim); text-transform:uppercase; white-space:nowrap;}
  #currencies{display:flex; gap:6px; margin-left:auto; font-size:11px; align-items:center; font-family:"IBM Plex Mono",monospace;}
  .cur{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:2px 8px; white-space:nowrap;}
  .cur b{color:var(--accent);}
  #devbtn{background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px;
    padding:2px 8px; font-size:12px;}
  #main{flex:1; display:flex; overflow:hidden;}
  #tabs{display:flex; flex-direction:column; width:84px; background:var(--panel);
    border-right:1px solid var(--line); flex-shrink:0; padding-top:6px;}
  #tabs button{padding:14px 0; background:none; border:none; color:var(--dim); font-size:11px;
    letter-spacing:.06em; text-transform:uppercase; border-left:3px solid transparent; cursor:pointer;}
  #tabs button.active{color:var(--accent); font-weight:700; border-left-color:var(--accent); background:rgba(62,224,160,.05);}
  #app{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0;
    padding:12px 16px calc(72px + env(safe-area-inset-bottom, 0px));}
  .s-module>*,.s-itemDetail>*,.s-end>*,.s-raidsim>*{max-width:640px; margin-inline:auto;}
  h1{font-family:"Archivo",sans-serif; font-weight:800; font-size:16px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:2px;}
  h2{font-family:"Archivo",sans-serif; font-weight:700; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim); margin:12px 0 6px;}
  .sub{font-size:11px; color:var(--dim); margin-bottom:8px;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 12px; margin-bottom:8px;}
  .card.tap{cursor:pointer;}
  .card.selected{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .card.locked{opacity:.45;}
  .row{display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .small{font-size:11px; color:var(--dim);}
  .ok{color:var(--accent);} .warn{color:var(--accent2);} .bad{color:var(--danger);} .trackc{color:var(--track);}
  .pill{display:inline-block; font-size:10px; border:1px solid var(--line); border-radius:8px; padding:1px 6px;
    color:var(--dim); margin-right:4px;}
  button.primary{width:100%; padding:12px; background:linear-gradient(135deg,#3FE0D0,#3FE0D0); color:#040E12; border:none; border-radius:10px;
    font-family:"Archivo",sans-serif; font-size:14px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; margin-top:10px; cursor:pointer;
    box-shadow:var(--glow-teal);}
  button.primary:disabled{background:var(--panel2); color:var(--dim);}
  button.ghost{width:100%; padding:10px; background:none; border:1px solid var(--line); color:var(--txt);
    border-radius:10px; font-size:13px; margin-top:8px; cursor:pointer;}
  button.ad{background:var(--accent2); color:#1c1503; border:none; border-radius:10px; padding:10px; width:100%;
    font-weight:700; font-size:13px; margin-top:8px; cursor:pointer;}
  .goalbar{background:linear-gradient(90deg,#10202b,#131a21); border:1px solid var(--track); border-radius:10px;
    padding:7px 12px; margin-bottom:10px; font-size:12px;}
  .goalbar b{color:var(--track);}
  #bitdock{position:absolute; bottom:10px; left:96px; max-width:46%; display:flex; gap:8px;
    align-items:flex-end; pointer-events:none; z-index:5;}
  #bitface{width:52px; height:52px; border-radius:12px; background:var(--panel2); border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--accent); flex-shrink:0;
    transition:filter .8s; box-shadow:0 0 12px rgba(62,224,160,0.16), inset 0 0 10px rgba(21,214,190,0.07);}
  body.bit-img #bitface{background:var(--panel2) url("assets/bit.png") 50% 40%/150% auto no-repeat; color:transparent;}
  #bitface.off{border-color:var(--line); color:var(--dim); filter:grayscale(1) brightness(.6);}
  #bitline{background:rgba(19,26,33,.96); border:1px solid var(--line); border-radius:10px 10px 10px 2px;
    padding:7px 10px; font-size:12px; color:var(--txt);}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:6px;}
  .slot{aspect-ratio:1; background:var(--panel); border:1px solid var(--line); border-radius:8px; display:flex;
    flex-direction:column; align-items:center; justify-content:center; font-size:10px; text-align:center; padding:3px;
    cursor:pointer; position:relative; color:var(--txt);}
  .slot .qty{position:absolute; bottom:2px; right:4px; font-size:9px; color:var(--dim);}
  .slot.reserved{border-color:var(--track);} .slot.secure{border-color:var(--accent2);}
  .slot.r-common{border-left:3px solid #d6dde0;} .slot.r-uncommon{border-left:3px solid #3ddc6a;} .slot.r-rare{border-left:3px solid #3d8bff;}
  .slot.r-epic{border-left:3px solid #b05cff;} .slot.r-legendary{border-left:3px solid #ffc12e;} .rar-common{color:#d6dde0}.rar-uncommon{color:#3ddc6a}.rar-rare{color:#3d8bff}.rar-epic{color:#b05cff}.rar-legendary{color:#ffc12e}
  .feed{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:12px; line-height:1.9;}
  .feed .bitl{color:var(--accent);}
  .feed .hostile{color:var(--danger);}
  #overlay{position:absolute; inset:0; background:rgba(4,7,10,.93); z-index:20; display:flex; align-items:center;
    justify-content:center; padding:20px;}
  #overlay .inner{width:100%; max-width:480px; text-align:center; max-height:100%; overflow-y:auto;}
  .flagbanner{background:var(--track); color:#04121c; font-weight:800; font-size:13px; letter-spacing:.05em;
    padding:11px; border-radius:10px; margin:10px 0; animation:flash .5s ease 3;}
  @keyframes flash{0%,100%{filter:brightness(1);}50%{filter:brightness(1.7);}}
  .payoff{animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(.8); opacity:0;}100%{transform:scale(1); opacity:1;}}
  .shake{animation:shake .5s ease;}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}
    60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
  /* Decorative text never takes taps: only real buttons on the base map receive input. */
  #app.s-base>h1,#app.s-base>.sub,#app.s-base>.restbar,#app.s-base .goalbar,.hubstate,.panhelp{pointer-events:none;}
  #app-version{position:fixed;right:calc(8px + var(--sr));bottom:calc(4px + env(safe-area-inset-bottom, 0px));z-index:40;font:9px "IBM Plex Mono",monospace;color:var(--dim);opacity:.6;pointer-events:none;}
  #toast{position:absolute; top:44px; right:12px; width:300px; z-index:30; pointer-events:none;}
  .toastmsg{background:var(--panel2); border:1px solid var(--accent); border-radius:10px; padding:9px 12px;
    font-size:12px; margin-bottom:6px; animation:pop .4s ease;}
  .restbar{height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-top:6px;}
  .restbar>div{height:100%; background:var(--accent); transition:width 1.2s ease;}
  .radio{display:flex; gap:6px; margin-top:6px;}
  .radio .card{flex:1; text-align:center; margin:0; padding:8px 4px; font-size:11px;}
  select{width:100%; background:var(--panel2); color:var(--txt); border:1px solid var(--line); border-radius:8px;
    padding:7px; font-size:13px; margin-top:4px;}
  .kv{display:flex; justify-content:space-between; font-size:12px; padding:3px 0;}
  .devgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .devgrid button{padding:9px 4px; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    border-radius:8px; font-size:11px; cursor:pointer;}
  .progressmoved{border-left:3px solid var(--accent); padding-left:10px; margin:10px 0; font-size:12px; line-height:1.7;}
  #app.s-intro{background:linear-gradient(rgba(7,21,28,.35),rgba(7,21,28,.92)), url("assets/keyart-start-screen.png") center/cover no-repeat;}
  .fac{display:flex; flex-direction:row; gap:10px; margin:8px 0; padding:12px;
    background:linear-gradient(rgba(7,21,28,.84),rgba(7,21,28,.93)), url("assets/env-bunker.png") center/cover no-repeat;
    border:1px solid var(--line); border-radius:12px;
    position:relative; min-height:230px;}
  .fac::before{content:""; position:absolute; top:50%; left:10px; right:10px; height:2px;
    background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 12px); opacity:.5;}
  .facrow{display:flex; flex-direction:column; gap:10px; flex:1; position:relative; z-index:1;}
  .facrow:first-child{flex:1.25;}
  .room{flex:1; min-height:0; border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    background:linear-gradient(180deg,#151d26,#101820); cursor:pointer; position:relative; overflow:hidden;
    transition:filter .8s, box-shadow .8s, border-color .8s; display:flex; flex-direction:column;}
  .roomname{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim);
    display:flex; justify-content:space-between;}
  .roomname .lvl{color:var(--accent); font-weight:800;}
  .room.built .roomname{color:var(--txt);}
  .room.dark{filter:brightness(.35) saturate(.1); cursor:default;}
  .room.dark .roomname{color:#3a4550;}
  .room.broken{filter:saturate(.25) brightness(.75);}
  .room.broken::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background:
      linear-gradient(105deg, transparent 42%, rgba(0,0,0,.75) 43%, transparent 44%),
      linear-gradient(23deg, transparent 63%, rgba(0,0,0,.7) 64%, transparent 65.5%),
      linear-gradient(160deg, transparent 22%, rgba(0,0,0,.6) 23%, transparent 24%);}
  .room.broken .roomart{animation:brokenflicker 3.1s infinite;}
  @keyframes brokenflicker{0%,91%,94%,100%{opacity:.7}92%,95%{opacity:.25}}
  .room.ready{border-color:var(--accent); animation:readypulse 1.6s infinite;}
  @keyframes readypulse{0%,100%{box-shadow:0 0 0 0 rgba(62,224,160,0.0)}50%{box-shadow:0 0 16px 2px rgba(62,224,160,0.23)}}
  .room.built{border-color:#2c4a3e; box-shadow:inset 0 0 24px rgba(62,224,160,0.03);}
  .fac.wake .room{animation:roomwake 1.1s both;}
  @keyframes roomwake{from{filter:brightness(.05) saturate(0)}to{}}
  .roomart{flex:1; min-height:34px; display:flex; align-items:center; justify-content:center; margin:4px 0;}
  .corering{width:44px; height:44px; border-radius:50%; border:3px solid var(--accent);
    box-shadow:0 0 18px rgba(62,224,160,0.32), inset 0 0 12px rgba(62,224,160,0.23); animation:corepulse 2s infinite;}
  @keyframes corepulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .roomart.off .corering{border-color:#2c3742; box-shadow:none; animation:none;}
  .fabbars{display:flex; gap:5px; align-items:flex-end; height:34px;}
  .fabbars i{width:9px; background:var(--accent2); border-radius:2px; animation:fabpump 1.1s infinite;}
  .fabbars i:nth-child(1){height:60%;} .fabbars i:nth-child(2){height:95%; animation-delay:.2s;}
  .fabbars i:nth-child(3){height:45%; animation-delay:.4s;}
  @keyframes fabpump{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}
  .roomart.off .fabbars i{background:#2c3742; animation:none;}
  .bitart{width:40px; height:40px; border-radius:50%; border:2px solid var(--accent); color:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:13px; animation:bithover 2.4s ease-in-out infinite;}
  body.bit-img .bitart{background:url("assets/bit.png") 50% 36%/230% auto no-repeat; color:transparent;}
  @keyframes bithover{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .roomart.off .bitart{border-color:#2c3742; color:#3a4550; animation:none; filter:grayscale(1) brightness(.5);}
  .crates{display:grid; grid-template-columns:repeat(3,14px); gap:3px;}
  .crates i{width:14px; height:11px; background:var(--accent2); opacity:.85; border-radius:2px;}
  .roomart.off .crates i{background:#2c3742;}
  .chips{display:flex; flex-wrap:wrap; gap:3px;}
  .chip{font-size:9px; letter-spacing:.02em; background:rgba(0,0,0,.45); border:1px solid var(--line);
    border-radius:7px; padding:1px 5px; color:var(--dim); white-space:nowrap;}
  .chip.ok{color:var(--accent); border-color:#2c4a3e;}
  .chip.need{color:var(--accent2); border-color:#4a3f1e;}
  .chip.track{color:var(--track); border-color:var(--track);}
  .roombar{height:4px; background:rgba(0,0,0,.5); border-radius:2px; overflow:hidden; margin-top:5px;}
  .roombar>div{height:100%; background:linear-gradient(90deg,var(--track),var(--accent)); transition:width .8s ease;}
  .prepgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 16px; align-items:start;}
  .pcol{min-width:0;}
  .rbenefit{font-family:"IBM Plex Mono",monospace; font-size:8.5px; color:var(--dim); letter-spacing:.03em; margin:1px 0 3px;}
  .room.dark .rbenefit{visibility:hidden;}
  .artadd{display:inline-block; margin-left:8px; animation:pop .6s ease;}
  .aa-cargo{width:16px; height:12px; background:var(--accent2); border-radius:2px; box-shadow:0 0 6px rgba(255,157,77,.6);}
  .aa-arm2{width:6px; height:22px; background:var(--accent2); border-radius:2px;}
  .aa-vault{width:18px; height:14px; border:2px solid var(--accent2); border-radius:3px;}
  .aa-grid{width:26px; height:3px; background:var(--accent); box-shadow:var(--glow-teal); border-radius:2px;}
  .nextup{border:1px solid var(--track); border-radius:12px; padding:10px 14px; margin:12px 0 4px;
    background:linear-gradient(135deg,#0e1c26,#131a21); animation:pop .5s ease;}
  .nu-head{font-size:10px; letter-spacing:.14em; color:var(--track); text-transform:uppercase; margin-bottom:2px;}
  .dangerbar{height:8px; background:rgba(0,0,0,.5); border-radius:5px; overflow:hidden; margin:6px 0 12px; border:1px solid var(--line);}
  .dangerbar>div{height:100%; background:linear-gradient(90deg,var(--accent2),var(--danger)); transition:width .6s ease; box-shadow:0 0 8px rgba(224,85,85,.5);}
  .nubar{height:9px; background:rgba(0,0,0,.55); border-radius:5px; overflow:hidden; margin:7px 0 5px;
    border:1px solid var(--line);}
  .nubar>div{height:100%; background:linear-gradient(90deg,var(--track),var(--accent));
    animation:nufill 1.1s ease; box-shadow:0 0 8px rgba(62,224,160,0.27);}
  @keyframes nufill{from{width:0}}
  .boot{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:13px; color:var(--accent); text-align:left;
    min-height:150px; line-height:2;}
  .boot div{animation:pop .3s ease;}
  .bootflash{font-size:17px; font-weight:800; letter-spacing:.1em; margin-top:12px;
    animation:flash .4s ease 4 !important;}
  .dustwrap{position:relative; height:0;}
  .dustwrap i{position:absolute; width:3px; height:3px; border-radius:50%; background:var(--dim); opacity:0;
    animation:dustup 1.6s ease-out forwards;}
  @keyframes dustup{0%{opacity:.8; transform:translateY(0)}100%{opacity:0; transform:translateY(-46px)}}
  @media (orientation:landscape) and (max-height:480px){
    #app{padding-bottom:calc(12px + env(safe-area-inset-bottom, 0px));}
    #app.s-base .nextup{display:none;}
    #app.s-base>button.primary,#app.s-prep>button.primary{
      position:fixed; z-index:10; left:calc(84px + 16px + var(--sl));
      right:calc(16px + var(--sr)); bottom:calc(8px + env(safe-area-inset-bottom, 0px));
      width:auto; margin:0;}
    #app.s-prep .mappanel{height:72px;}
    #app.s-decision .decision-actions{
      position:fixed; z-index:10; left:calc(84px + 16px + var(--sl));
      right:calc(16px + var(--sr)); bottom:env(safe-area-inset-bottom, 0px);
      padding:8px 0; background:rgba(7,21,28,.96); border-top:1px solid var(--line);}
    #app.s-decision .decision-actions button{margin-top:0;}
    #app.s-decision .decision-actions .small{display:block; margin:2px 0 6px;}
  }
  @media (display-mode:standalone), (display-mode:fullscreen){
    #topbar{padding-top:calc(6px + env(safe-area-inset-top, 0px));}
    #tabs{padding-left:var(--sl); padding-bottom:env(safe-area-inset-bottom, 0px);}
    #app{padding-right:calc(16px + var(--sr));}
  }

  /* ---- shared panoramic bunker viewer ---- */
  .baseviewer{position:relative;width:100%;height:clamp(280px,58vh,620px);overflow:hidden;border:1px solid var(--line);
    border-radius:12px;margin:8px 0;background:#080d15;touch-action:none;cursor:grab;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .baseviewer.dragging{cursor:grabbing;}
  .baseworld{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;}
  .baseplate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none;}
  .baseplate.outgoing{z-index:1;animation:plateOut .7s ease forwards;}
  .baseplate.current{z-index:2;}.baseplate.revealing{animation:plateIn .7s ease both;}
  @keyframes plateIn{from{opacity:0;filter:brightness(.55)}to{opacity:1;filter:brightness(1)}}
  @keyframes plateOut{to{opacity:0}}
  .mapspot{position:absolute;z-index:6;transform:translate(-50%,-50%);border:1px solid var(--accent);border-radius:9px;
    padding:6px 9px;background:rgba(7,21,28,.9);color:var(--txt);font:10px "IBM Plex Sans",sans-serif;box-shadow:0 0 12px rgba(21,214,190,0.09);cursor:pointer;white-space:nowrap;}
  .mapspot small{display:block;color:var(--dim);font-size:8px;margin-top:2px}.mapspot.locked{border-color:#59636b;color:#aeb8ba;box-shadow:none;}
  .mapspot.ready{border:2px solid #67e59c;color:#a6ffc9;box-shadow:0 0 16px rgba(103,229,156,0.2)}
  .mapspot.ready small{color:#a6ffc9}.access-next{border:1px solid #67e59c}.access-next .nu-head{color:#a6ffc9}
  @media (orientation:landscape) and (max-height:480px){#app.s-base .nextup.access-next{display:block;padding:8px}.access-next p{margin:4px 0}.access-next button{width:auto;margin:4px 0;padding:5px 10px}}
  .starter-prep h2{margin-top:8px}.prep-locked{opacity:.45;cursor:default}.prep-benefit{border-color:#67e59c}
  .prep-crafting summary{cursor:pointer;color:#a6ffc9}.prep-crafting small{color:var(--dim)}
  .mapspot.unlocked{animation:roomLight 1.2s ease both}.mapspot.preview{border-style:dashed;opacity:.82}.style-status{color:var(--accent2)!important}@keyframes roomLight{50%{box-shadow:0 0 24px 6px rgba(255,157,77,.5)}}
  .mapspot.gate{color:var(--accent);}.hubstate,.panhelp{position:absolute;z-index:5;background:rgba(7,21,28,.82);border:1px solid var(--line);

  /* ===== v1.28 base HUD (CoC-inspired): min 14px body / 12px labels, 44px tap targets, text on solid panels ===== */
  :root{--tap:44px; --fs-body:15px; --fs-label:12px; --ok2:#67e59c; --warn2:#ffb648; --solid:#0d2129;}
  body{font-size:var(--fs-body);}
  h1{font-size:20px;} h2{font-size:14px;} .sub,.small,.kv,.card{font-size:14px;} .pill{font-size:12px;}
  .card{padding:12px 14px;} select{font-size:15px; min-height:var(--tap);}
  button.primary,button.ghost,button.ad{min-height:var(--tap); font-size:15px;}
  button.ghost.inline{width:auto; margin:0; padding:8px 14px;}
  button.ghost:disabled{opacity:.4;}
  .goalbar{font-size:14px;} .feed{font-size:14px;} #bitline{font-size:14px;} .toastmsg{font-size:14px;}
  .devgrid button{font-size:12px; min-height:var(--tap);}
  .slot{font-size:12px; gap:2px;} .slot .qty{font-size:12px; color:var(--txt);} .slot .sicon{font-size:24px; line-height:1;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px;}
  .progressmoved{font-size:14px;}
  #app-version{font-size:12px; opacity:.75;}
  /* top bar: icon + number pills, settings gear */
  #topbar{gap:8px; padding:calc(6px + env(safe-area-inset-top,0px)) 10px 6px; position:relative; z-index:25;}
  #topbar .title{font-size:12px;}
  #currencies{gap:6px; font-size:16px; flex-wrap:wrap; justify-content:flex-end; font-family:"Archivo",sans-serif;}
  .cur{display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:3px 12px 3px 3px; border-radius:22px; border:2px solid var(--line); background:var(--solid); color:var(--txt);}
  .cur i{width:32px; height:32px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:17px; background:#163a42;}
  .cur b{color:var(--txt); font-weight:800;} .cur .lbl{font-size:12px; color:var(--dim);}
  .cur-scrap i{background:#5b4b33}.cur-salvage i{background:#2f5b3f}.cur-dataCores i{background:#2d3f6a}.cur-signals i{background:#4a2d6a}.cur-fuel i{background:#6a4a2d}
  .bondpill{min-height:var(--tap); border-color:var(--accent); cursor:pointer; font:inherit;} .bondpill i{background:var(--accent); color:#04222a; font-weight:900;}
  .iconbtn{width:var(--tap); height:var(--tap); flex:none; border-radius:50%; background:var(--solid); border:2px solid var(--line); color:var(--txt); font-size:20px; display:grid; place-items:center; cursor:pointer;}
  #menubtn{margin-left:4px;}
  .menu{position:absolute; right:10px; top:calc(100% + 4px); z-index:45; min-width:230px; background:var(--solid); border:2px solid var(--line); border-radius:16px; padding:10px; box-shadow:0 12px 30px #000c; display:flex; flex-direction:column; gap:8px;}
  .menu[hidden]{display:none;}
  .menu-head{font:800 12px "Archivo",sans-serif; letter-spacing:.12em; text-transform:uppercase; color:var(--dim);}
  .menu button{min-height:var(--tap); border-radius:12px; border:2px solid var(--line); background:#102b33; color:var(--txt); font-size:15px; text-align:left; padding:0 14px; cursor:pointer;}
  .menu button.reset-progress{color:#ffb4ab; border-color:#6a2d2d; margin:0; width:auto; text-transform:none; letter-spacing:0;}
  .menu-ver{font:12px "IBM Plex Mono",monospace; color:var(--dim);}
  /* bottom bar: big icon buttons with badges, RAID is the hero */
  #tabs{display:flex; flex-direction:row; gap:8px; align-items:flex-end; width:auto; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); background:var(--panel); border-top:1px solid var(--line); border-right:0; flex-shrink:0; z-index:22;}
  #tabs button{position:relative; flex:1; max-width:110px; min-height:60px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border-radius:16px; border:2px solid var(--line); background:var(--solid); color:var(--txt); font:800 12px "Archivo",sans-serif; letter-spacing:.06em; padding:4px 2px; box-shadow:0 4px 0 #031015;}
  #tabs button .ni{font-size:24px; line-height:1.05;}
  #tabs button.active{border-color:var(--accent); color:var(--accent); background:var(--solid);}
  #tabs button.locked{opacity:.45; box-shadow:none;}
  #tabs .nav-prep{max-width:130px; min-height:72px; background:linear-gradient(#ff8a3c,#d9461f); border:3px solid #ffd2a8; color:#fff; font-size:15px; box-shadow:0 5px 0 #8b2a10;}
  #tabs .nav-prep.locked{background:var(--solid); border-color:var(--line); color:var(--txt);}
  #tabs .nav-prep .ni{font-size:28px;}
  .badge{position:absolute; top:-9px; right:-7px; min-width:24px; height:24px; padding:0 5px; border-radius:12px; display:grid; place-items:center; font:900 13px "Archivo",sans-serif; border:2px solid #fff; box-shadow:0 2px 6px #000a; z-index:2;}
  .badge.up{background:var(--ok2); color:#04222a}.badge.need{background:var(--warn2); color:#2a1800}.badge.alert{background:var(--danger); color:#fff}
  body[data-screen=intro] #tabs,body[data-screen=raidsim] #tabs,body[data-screen=checkpoint] #tabs,body[data-screen=combatDemo] #tabs{display:none;}
  #bitdock{left:12px; bottom:calc(96px + env(safe-area-inset-bottom,0px)); max-width:min(46%,420px);}
  #toast{top:64px; right:10px; width:min(320px,calc(100% - 20px));}
  #app{padding-bottom:16px;}
  /* base: full-bleed map, building plates with level + badges */
  #app.s-base{padding:0; overflow:hidden; overflow:clip; position:relative;}
  .baseviewer{overflow:clip;}
  #app.s-base .baseviewer{height:100%; border:0; border-radius:0;}
  .mapspot.plate{transform:translate(-50%,-50%) scale(var(--inv,1)); background:none; border:0; padding:0; box-shadow:none; min-width:var(--tap); min-height:var(--tap); display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--txt); font:inherit; animation:none;}
  .mapspot.plate .tag{display:flex; align-items:center; gap:6px; min-height:var(--tap); padding:4px 10px 4px 6px; border-radius:14px; background:var(--solid); border:2px solid var(--accent); font:800 15px "Archivo",sans-serif; white-space:nowrap; box-shadow:0 4px 12px #0009;}
  .mapspot.plate .tag i{font-style:normal; font-size:20px;}
  .mapspot.plate .tag em{font-style:normal; min-width:24px; text-align:center; background:var(--accent); color:#04222a; border-radius:8px; padding:0 6px; font-size:14px;}
  .mapspot.plate small{display:block; font-size:12px; color:var(--txt); background:var(--solid); border-radius:8px; padding:2px 8px; max-width:200px; white-space:normal; margin:0;}
  .mapspot.plate.locked .tag{border-color:#59636b; color:#c9d2d3;}
  .mapspot.plate.ready .tag{border-color:var(--ok2); box-shadow:0 0 16px rgba(103,229,156,0.23);}
  .mapspot.plate.ready small{color:#a6ffc9;}
  .mapspot.plate.gate .tag{border-color:var(--accent2);}
  .mapspot.plate.unlocked .tag{animation:roomLight 1.2s ease both;}
  .mapspot.plate.preview .tag{border-style:dashed;}
  .mapspot.plate .badge{top:-10px; right:-10px;}
  .baseviewer .hubstate{left:10px; top:10px; font-size:12px; padding:5px 10px; background:var(--solid); border-radius:10px;}
  .goalpill{position:absolute; z-index:8; left:10px; bottom:12px; max-width:min(360px,calc(100% - 20px)); min-height:52px; display:flex; align-items:center; gap:10px; text-align:left; padding:6px 14px 6px 10px; border-radius:16px; background:var(--solid); border:2px solid var(--track); color:var(--txt); font:inherit; box-shadow:0 6px 16px #000a;}
  button.goalpill{cursor:pointer;} div.goalpill{pointer-events:none;}
  .goalpill i{font-style:normal; font-size:24px;} .goalpill small{display:block; font:800 12px "Archivo",sans-serif; letter-spacing:.08em; color:var(--dim);} .goalpill b{font-size:15px;}
  .goalpill.need{border-color:var(--warn2);} .goalpill.ready{border-color:var(--ok2);}
  /* building popup: compact sheet with one big action */
  #overlay.sheet{background:rgba(4,7,10,.45); align-items:flex-end; justify-content:flex-end; padding:12px;}
