name: op01-dev-snapshot
on:
  push:
    branches: [feat/op01-gameplay-validation]
    paths: ['.github/workflows/op01-dev-snapshot.yml']
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary source snapshot for animation QA
        run: |
          tar czf op01-dev-source.tar.gz \
            nodspel/op01-gameplay.js nodspel/tests/op01-gameplay.test.mjs \
            nodspel/vendor ui/raid-prep-op01.mjs \
            assets/operators/OP01_Game_LOD0.glb \
            assets/operators/OP01_Game_LOD1.glb \
            assets/operators/OP01_Game_LOD2.glb
      - uses: actions/upload-artifact@v4
        with:
          name: op01-dev-source
          path: op01-dev-source.tar.gz
          retention-days: 1
