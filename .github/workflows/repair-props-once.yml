name: repair-props-once
on:
  push:
    branches: [fix/props-validation-mobile-budget]
    paths:
      - '.github/workflows/repair-props-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/props-validation-mobile-budget
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Re-export four malformed GLBs
        run: node scripts/repair-props-glb.mjs
      - name: Validate all props
        run: |
          npm install --no-save --package-lock=false gltf-validator@2.0.0-dev.3.10
          node scripts/validate-props.mjs
      - name: Commit repaired binary assets and manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/env/shore/shore_rock_edge_4m.glb assets/env/shore/manifest.json
          git add assets/env/nature/rocks/rock_granite_s_a.glb assets/env/nature/rocks/rock_granite_s_b.glb assets/env/nature/rocks/rock_granite_s_c.glb assets/env/nature/rocks/manifest.json
          git diff --cached --quiet || git commit -m "fix(props): re-export four invalid GLBs and update manifest sizes"
          git push origin HEAD:fix/props-validation-mobile-budget
