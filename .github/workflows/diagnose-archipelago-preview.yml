name: Diagnose public Archipelago v2 boot
on:
  push:
    branches: [feat/archipelago-visual-target-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save puppeteer
      - run: node scripts/diagnose-archipelago-preview.mjs
