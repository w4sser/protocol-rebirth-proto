name: Apply layout CI patch v2
on:
  push:
    branches: [fix/layout-pages-stability]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'Apply layout CI patch v2')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/layout-pages-stability
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-layout-ci-fix-v2.mjs
      - run: node --check scripts/layout-check.mjs
      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add scripts/layout-check.mjs .github/workflows/ci.yml
          git diff --cached --quiet || git commit -m "Apply layout CI patch v2"
          git push
