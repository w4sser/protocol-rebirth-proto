name: ground-v2-khronos
on:
  pull_request:
    paths:
      - 'assets/env/terrain/**'
      - 'scripts/validate-terrain-glbs.mjs'
      - 'scripts/validate-terrain-pngs.mjs'
      - 'scripts/shot-ground-v2.mjs'
      - 'nodspel/ground-preview.js'
      - 'nodspel/ground-organic-trail.mjs'
      - 'nodspel/tests/ground-organic-trail.test.mjs'
      - 'nodspel/game.mjs'
      - '.github/workflows/ground-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check preview source syntax
        run: |
          node --check nodspel/ground-preview.js
          node --check nodspel/ground-organic-trail.mjs
          node --check nodspel/tests/ground-organic-trail.test.mjs
          node --check nodspel/game.mjs
          node --check scripts/shot-ground-v2.mjs
          node --check scripts/validate-terrain-glbs.mjs
          node --check scripts/validate-terrain-pngs.mjs
      - name: Verify organic trail widths, fade, winding and node-depth order
        run: node --test nodspel/tests/ground-organic-trail.test.mjs
      - name: Validate new PNG files, alpha and splat channel normalization
        run: node scripts/validate-terrain-pngs.mjs
      - name: Install official Khronos glTF Validator
        run: npm install --no-save --no-package-lock gltf-validator@2.0.0-dev.3.10
      - name: Validate every ground GLB and its external PNG resources
        run: node scripts/validate-terrain-glbs.mjs
      - name: Upload full glTF issue report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ground-v2-khronos-report
          path: verify-out/ground-v2/khronos-glb-validation.json
          if-no-files-found: warn

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser for preview smoke captures
        run: npm i --no-save puppeteer
      - name: Render OFF/HIGH/LOW for bunker and archipelago from raid camera
        run: node scripts/shot-ground-v2.mjs
        env:
          SMOKE_CAPTURE: '1'
      - name: Capture iPhone-sized archipelago HIGH and LOW
        run: node scripts/shot-ground-v2.mjs
        env:
          SMOKE_CAPTURE: '1'
          MOBILE_VIEWPORT: '1'
          AREAS: archipelago
          OUT: verify-out/ground-v2/phone-viewport
      - name: Diagnose coral rectangles near Keycard (level 3, ground OFF/HIGH/LOW)
        run: node scripts/shot-ground-v2.mjs
        env:
          SMOKE_CAPTURE: '1'
          AREAS: bunker
          LEVEL: '3'
          OUT: verify-out/ground-v2/keycard-audit
      - name: Upload in-engine comparison captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ground-v2-in-game-captures
          path: verify-out/ground-v2/
          if-no-files-found: warn
