name: vendor-polyfork-glbs
on:
  push:
    branches:
      - feat/vendor-polyfork-assets-20261108
    paths:
      - '.github/workflows/vendor-polyfork-glbs.yml'
      - 'scripts/vendor-polyfork-assets.mjs'
permissions:
  contents: write
concurrency:
  group: vendor-polyfork-glbs-20261108
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download and validate free low-poly GLBs
        run: node scripts/vendor-polyfork-assets.mjs
      - name: Commit immutable local models with attribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nodspel/assets/polyfork
          git diff --cached --quiet && exit 0
          git commit -m "Vendor 19 CC-BY-4.0 Polyfork GLB meshes locally"
          git push origin HEAD:feat/vendor-polyfork-assets-20261108
