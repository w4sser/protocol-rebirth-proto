name: bridge-landing-collision
on:
  pull_request:
    paths:
      - 'nodspel/bridge-flow.mjs'
      - 'nodspel/levels.js'
      - 'nodspel/big-level.js'
      - 'nodspel/archipelago.js'
      - 'nodspel/bridge-deck.mjs'
      - 'nodspel/physics.mjs'
      - 'nodspel/combat.js'
      - 'nodspel/game.mjs'
      - 'nodspel/tests/bridge-rock-artillery-regression.test.mjs'
      - 'nodspel/tests/bridge-landing-collision.test.mjs'
      - '.github/workflows/bridge-landing-collision.yml'
jobs:
  diagonal-entry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate bridge entries, rock contacts, bot navigation and artillery
        run: node --test nodspel/tests/bridge-landing-collision.test.mjs nodspel/tests/bridge-rock-artillery-regression.test.mjs
