name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci || npm install
      - run: npm test
      - run: cd nodspel && npm test
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save puppeteer
      - run: node scripts/layout-check.mjs
        env:
          LAYOUT_OUT: verify-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-screenshots
          path: verify-out
